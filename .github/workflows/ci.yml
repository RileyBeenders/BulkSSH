name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Install scripts are skipped: Electron downloads its binary lazily on
      # first run (not needed here), and ssh2's optional native build is unused.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test
